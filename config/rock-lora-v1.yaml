---
job: extension
config:
  # this name will be the folder and filename name
  name: "rock-lora-v1"
  process:
    - type: 'sd_trainer'
      # root folder to save training sessions/samples/weights
      training_folder: "output/loras"      
      performance_log_every: 1000
      device: cuda:0
      # if a trigger word is specified, it will be added to captions of training data if it does not already exist
      # alternatively, in your captions you can add [trigger] and it will be replaced with the trigger word
      trigger_word: "ohwx man"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16 # precision to save
        save_every: 200 # save every this many steps
        max_step_saves_to_keep: 15 # how many intermittent saves to keep
        push_to_hub: false #change this to True to push your trained model to Hugging Face.
        # You can either set up a HF_TOKEN env variable or you'll be prompted to log-in         
#       hf_repo_id: your-username/your-model-slug
#       hf_private: true #whether the repo is private or public
      datasets:
        # datasets are a folder of images. captions need to be txt files with the same name as the image
        # for instance image2.jpg and image2.txt. Only jpg, jpeg, and png are supported currently
        # images will automatically be resized and bucketed into the resolution specified
        # on windows, escape back slashes with another backslash so
        # "C:\\path\\to\\images\\folder"
        - folder_path: "/home/wsl/src/ai-toolkit/training/rock"
          caption_ext: "txt"
          caption_dropout_rate: 0.05  # will drop out the caption 5% of time
          shuffle_tokens: false  # shuffle caption order, split by commas
          cache_latents_to_disk: true  # leave this true unless you know what you're doing
          resolution: [ 512, 768, 1024 ]  # flux enjoys multiple resolutions
      train:
        batch_size: 1
        steps: 2500  # total number of steps to train 500 - 4000 is a good range
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false  # probably won't work with flux
        # content_or_style: balanced
        gradient_checkpointing: true  # need the on unless you have a ton of vram
        noise_scheduler: "flowmatch" # for training only
        optimizer: "adamw8bit"
        lr: 4e-4
        # uncomment this to skip the pre training sample
        skip_first_sample: true
        # uncomment to completely disable sampling
#        disable_sampling: true
        # uncomment to use new vell curved weighting. Experimental but may produce better results
#        linear_timesteps: true

        # ema will smooth out learning, but could slow it down. Recommended to leave on.
        ema_config:
          use_ema: true
          ema_decay: 0.99

        # will probably need this if gpu supports it for flux, other dtypes may not work correctly
        dtype: bf16
      model:
        # huggingface model name or path
        name_or_path: "black-forest-labs/FLUX.1-dev"
        is_flux: true
        quantize: true  # run 8bit mixed precision
        low_vram: true  # uncomment this if the GPU is connected to your monitors. It will use less vram to quantize, but is slower.
      sample:
        sampler: "flowmatch" # must match train.noise_scheduler
        sample_every: 200 # sample every this many steps
        width: 1024
        height: 1024
        prompts:
          # you can add [trigger] to the prompts here and it will be replaced with the trigger word
          - close headshot portrait photograph of ohwx man wearing a super expensive white suit, a light blue shirt and a black tie in a photo studio lighting hdr. The studio backdrop is a rich, deep black that makes the white suit pop dramatically. Professional lighting creates a perfect balance of highlights and shadows, accentuating his facial features. The suit is impeccably tailored, with subtle textures visible in the fabric. His tie is made of the finest silk, with a subtle pattern that catches the light. his expression is one of confident professionalism<segment:yolo-face_yolov9c.pt-1,0.7,0.5>photograph of ohwx man

          - mid portrait photograph of ohwx man wearing a super expensive black suit, a white shirt and a blue tie in a photo studio lighting hdr. The studio backdrop is a rich, deep white that makes the black suit pop dramatically. Professional lighting creates a perfect balance of highlights and shadows, accentuating his facial features. The suit is impeccably tailored, with subtle textures visible in the fabric. His tie is made of the finest silk, with a subtle pattern that catches the light. his expression is one of confident professionalism<segment:yolo-face_yolov9c.pt-1,0.7,0.5>photograph of ohwx man

          - photograph of ohwx man wearing an amazing white suit and a red shirt, wearing a black tie and very long thick blue beard and he is in a luxury coffee shop in paris<segment:yolo-face_yolov9c.pt-1,0.6,0.5>photograph of ohwx man with red hair and very long thick blue beard

          - muscular hdr 4k photograph of ohwx man wearing an amazing elven glowing shiny steel with gold robe over it full body full pant armor and standing in an ancient majestic elf city. The armor is a masterpiece of elven craftsmanship, with intricate designs etched into the steel and gold accents that catch the light. The robe flows gracefully over the armor, adding an air of regality. The lighting is dramatic, with the warm glow of a setting sun casting long shadows and highlighting the metallic sheen of the armor. His muscular physique is evident even through the armor, suggesting great strength and agility. They are elegantly crafted, with thin golden frames that complement the armor's design. His expression is one of confidence and wisdom, befitting a warrior-scholar in this ancient setting<segment:yolo-face_yolov9c.pt-1,0.7,0.5>photograph of ohwx man

